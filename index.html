<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Portal</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <div class="header__wrapper">
          <a href="#" class="header__logo">
            <img src="" alt="" />
            <span>Job Portal</span>
          </a>
          <nav class="header__nav">
            <ul class="header__list">
              <li class="header__item">
                <a href="#">Home</a>
              </li>
              <li class="header__item">
                <a href="#">Jobs</a>
              </li>
              <li class="header__item">
                <a href="#">About Us</a>
              </li>
              <li class="header__item">
                <a href="#">Contact Us</a>
              </li>
            </ul>
          </nav>
          <div class="header__actions">
            <a href="#">Login</a>
            <a class="button button--primary" href="#">Register</a>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <div class="hero__wrapper">
            <h1 class="hero__title">Find Your Dream Job Today!</h1>
            <p class="hero__subtitle">
              Connecting Talent with Opportunity: Your Gateway to Career Success
            </p>
            <form class="hero__search">
              <input
                class="form__input"
                type="text"
                placeholder="Job Title or Company"
              />
              <select class="form__select" name="" id="">
                <option value="">Select Location</option>
              </select>
              <select class="form__select" name="" id="">
                <option value="">Select Category</option>
              </select>
              <button class="button button--primary hero__button" type="submit">
                Search Job
              </button>
            </form>
            <ul class="hero__statistics">
              <li class="hero__stat">
                <img src="images/jobs.svg" alt="" /><span>25,850</span
                ><span>Jobs</span>
              </li>
              <li class="hero__stat">
                <img src="images/candidates.svg" alt="" /><span>10,250</span
                ><span>Candidates</span>
              </li>
              <li class="hero__stat">
                <img src="images/companies.svg" alt="" /><span>18,400</span
                ><span>Companies</span>
              </li>
            </ul>

            <ul class="hero__company-logos">
              <li class="hero__company-logo">
                <img src="images/spotify.svg" alt="Spotify" />
              </li>
              <li class="hero__company-logo">
                <img src="images/slack.svg" alt="Slack" />
              </li>
              <li class="hero__company-logo">
                <img src="images/adobe.svg" alt="Adobe" />
              </li>
              <li class="hero__company-logo">
                <img src="images/asana.svg" alt="Asana" />
              </li>
              <li class="hero__company-logo">
                <img src="images/linear.svg" alt="Linear" />
              </li>
            </ul>
          </div>
        </div>
      </section>

      <section class="jobs">...</section>

      <section class="category">...</section>

      <section class="about">...</section>

      <section class="testimonial">...</section>

      <section class="blog">...</section>
    </main>

    <footer>...</footer>
  </body>
</html>
